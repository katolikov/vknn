# The host-only gate (scripts/ci_host.sh) on every PR targeting main: host build,
# vknn_tests, the tools/ consistency checkers, clang-format (STRICT — drift fails
# the gate; the tree is formatted with clang-format 18, pinned below, and
# scripts/format.sh fixes drift in place), and CPU determinism. The Android and
# docs steps are skipped here (no NDK/doxygen on the runner); the on-device
# byte/perf gates remain manual, as documented in scripts/ci_host.sh.
name: ci-host

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Only the submodules the host build links against; glslang is the
      # shader toolchain and is not needed without the Android step.
      - name: submodules (host build)
        run: git submodule update --init --depth 1 third_party/googletest third_party/msgpack-c

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # onnx_optimizer test deps (pinned). The requirements file guard keeps the
      # workflow green on branches that predate tools/onnx_optimizer; without the
      # deps, ci_host.sh skips that step cleanly.
      - name: python deps
        run: |
          if [ -f tools/onnx_optimizer/requirements.txt ]; then
            pip install -r tools/onnx_optimizer/requirements.txt
          fi

      # The strict format gate only means something at a fixed formatter version:
      # clang-format's include-sort/comment behavior changes between releases, so
      # the gate pins the version the tree is formatted with.
      - name: clang-format 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-format-18
          sudo ln -sf "$(command -v clang-format-18)" /usr/local/bin/clang-format
          clang-format --version

      - name: ci_host.sh
        run: scripts/ci_host.sh --no-android --no-docs --strict-format

  # Android arm64-v8a cross-build (Vulkan backend + all shaders via the vendored
  # glslang) on a Linux host, exactly as build.sh drives it. Compile-only gate:
  # runners have no arm64 device; the on-device byte/perf gates stay manual.
  ci-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: submodules (android build)
        run: git submodule update --init --depth 1 third_party/googletest third_party/msgpack-c third_party/glslang

      - name: ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: build.sh --android
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ./build.sh --android

  # The same Android cross-build driven from Windows through build.ps1 (NDK from
  # the runner image; vcvars so the vendored-glslang HOST prebuild gets cl+ninja).
  ci-windows-android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: submodules (android build)
        run: git submodule update --init --depth 1 third_party/googletest third_party/msgpack-c third_party/glslang

      - name: build.ps1 --android
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "ANDROID_NDK=%ANDROID_NDK_LATEST_HOME%"
          pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1 --android

  # Windows host build + unit tests through build.ps1, with the MSVC toolchain
  # (vcvars64 located via vswhere; ninja is on the runner PATH, so the script
  # configures Ninja + cl). Guards the Windows port: the same vknn_tests suite
  # must pass natively on Windows.
  ci-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: submodules (host build)
        run: git submodule update --init --depth 1 third_party/googletest third_party/msgpack-c

      - name: build + run tests (build.ps1 --test)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1 --test
